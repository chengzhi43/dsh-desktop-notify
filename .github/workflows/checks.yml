name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check client.js
          node --check index.js
      - name: Manifest check
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch||!p.dsh?.client) throw new Error('manifest incomplete'); console.log('manifest ok', p.name, p.version)"
      - name: Status machine test
        run: node test/harness.cjs
      - name: Index file check
        run: node test/index-check.cjs
